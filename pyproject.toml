[project]
name = "bldc-fault-detection"
version = "0.1.0"
description = "Healthy vs. faulty BLDC motor classification from psychoacoustic features (LogReg, SVM, ANN, 1D-CNN)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "NPY", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004"]

[tool.ty.src]
include = ["train.py"]
